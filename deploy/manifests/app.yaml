apiVersion: apps/v1
kind: Deployment
metadata:
  name: unreproducible-app
spec:
  template:
    spec:
      containers:
        - name: app
          # Incident evidence claimed a readiness probe failed. The actual
          # sandbox manifest is healthy, so the failure must not be patched.
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
